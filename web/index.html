<!DOCTYPE html>
<html lang="en-AU">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TradieFlow AI — photo-led trade triage and dispatch.">
  <meta name="theme-color" content="#F1F3F5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TradieFlow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/tradieflow.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>TradieFlow AI</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0F1419;
      background: #F1F3F5;
    }
    body { margin: 0; }
    #startup-shell {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      overflow: auto;
      padding: 24px;
      background: #F1F3F5;
    }
    .startup-card {
      box-sizing: border-box;
      width: 100%;
      max-width: 440px;
      margin: auto;
      padding: clamp(24px, 5vw, 40px);
      border: 1px solid #0F1419;
      border-radius: 16px;
      background: #FFFFFF;
    }
    .eyebrow {
      margin: 0 0 24px;
      font: 0.75rem/1.5 ui-monospace, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 7vw, 2.5rem);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }
    p { line-height: 1.55; }
    #connection-hint {
      margin: 24px 0 0;
      padding-top: 24px;
      border-top: 1px solid #F1F3F5;
      font-size: 0.875rem;
    }
    #startup-retry {
      min-height: 48px;
      margin-top: 8px;
      padding: 12px 24px;
      border: 0;
      border-radius: 10px;
      color: #FFFFFF;
      background: #2C5EF5;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #startup-retry:hover { text-decoration: underline; }
    #startup-retry:focus-visible {
      outline: 3px solid #0F1419;
      outline-offset: 4px;
    }
  </style>
  <noscript><style>#startup-status { display: none; }</style></noscript>
</head>
<body>
  <main id="startup-shell" aria-labelledby="startup-title">
    <section class="startup-card">
      <p class="eyebrow">Trade triage / Dispatch</p>
      <h1 id="startup-title">TradieFlow AI</h1>
      <p id="startup-status" role="status" aria-live="polite" aria-atomic="true">Loading your workspace…</p>
      <button id="startup-retry" type="button" hidden>Retry loading</button>
      <p id="connection-hint" role="status" aria-live="polite" aria-atomic="true">A connection is required for sign-in, uploads and live triage.</p>
      <noscript><p>JavaScript is required to open TradieFlow AI. Enable it, then reload this page.</p></noscript>
    </section>
  </main>
  <script>
    (() => {
      const shell = document.getElementById('startup-shell');
      const status = document.getElementById('startup-status');
      const retry = document.getElementById('startup-retry');
      const hint = document.getElementById('connection-hint');
      let ready = false;
      const fail = () => {
        if (ready) return;
        clearTimeout(timeout);
        status.textContent = 'TradieFlow AI could not start. Check your connection and retry.';
        retry.hidden = false;
      };
      const connection = () => {
        hint.textContent = navigator.onLine
          ? 'A connection is required for sign-in, uploads and live triage.'
          : 'You’re offline. Reconnect to sign in, upload photos or get live triage updates.';
      };
      const timeout = setTimeout(() => {
        if (ready) return;
        status.textContent = 'Loading is taking longer than expected. Check your connection and retry.';
        retry.hidden = false;
      }, 30000);
      window.tradieFlowShell = { fail };
      retry.addEventListener('click', () => window.location.reload());
      window.addEventListener('error', fail, true);
      window.addEventListener('unhandledrejection', fail);
      window.addEventListener('online', connection);
      window.addEventListener('offline', connection);
      window.addEventListener('flutter-first-frame', () => {
        ready = true;
        clearTimeout(timeout);
        window.removeEventListener('error', fail, true);
        window.removeEventListener('unhandledrejection', fail);
        window.removeEventListener('online', connection);
        window.removeEventListener('offline', connection);
        shell.remove();
      }, { once: true });
      connection();
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
